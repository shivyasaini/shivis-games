<title>Emberfall</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #05060a;
}

#game {
  display: block;
  width: 100vw;
  height: 100vh;
  image-rendering: pixelated;
}
body { background: #05060a; }
</style>
<canvas id="game"></canvas>
<script>
'use strict';

// Deterministic random number generator so the world layout is the same
// every playthrough (change the seed in world.js for a new land).
function mulberry32(seed) {
  return function () {
    let t = (seed += 0x6D2B79F5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const angTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);

// Smallest signed difference between two angles, in [-PI, PI].
function angDiff(a, b) {
  let d = b - a;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return d;
}

// Cheap deterministic per-tile hash for ground color variation.
function tileHash(tx, ty) {
  let h = tx * 374761393 + ty * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return (h ^ (h >> 16)) & 255;
}
'use strict';

// ---------------------------------------------------------------------------
// SOUND — everything is synthesized live with the Web Audio API, so the game
// stays a single file with no audio assets. Music has three moods (explore,
// boss, ending); N toggles all sound.
// ---------------------------------------------------------------------------

const audio = {
  ctx: null, master: null, music: null, sfx: null,
  noise: null, delay: null,
  started: false, muted: false,
  mood: 'explore', nextNote: 0, beat: 0, timer: null,
};

// Called on the first click or key press (browsers require a user gesture).
function audioInit() {
  if (audio.started) return;
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const ctx = new C();
    audio.ctx = ctx;
    audio.master = ctx.createGain();
    audio.master.gain.value = 0.5;
    audio.master.connect(ctx.destination);
    audio.music = ctx.createGain();
    audio.music.gain.value = 0.22;
    audio.music.connect(audio.master);
    audio.sfx = ctx.createGain();
    audio.sfx.gain.value = 0.5;
    audio.sfx.connect(audio.master);

    // one shared noise buffer for whooshes and hits
    const len = ctx.sampleRate;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    audio.noise = buf;

    // a feedback delay gives the music its cavernous air
    const delay = ctx.createDelay(1);
    delay.delayTime.value = 0.42;
    const fb = ctx.createGain();
    fb.gain.value = 0.34;
    delay.connect(fb); fb.connect(delay);
    delay.connect(audio.music);
    audio.delay = delay;

    // the endless low drone of a dying land
    for (const [freq, vol] of [[73.42, 0.045], [110, 0.03], [73.9, 0.02]]) {
      const o = ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = freq;
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 260;
      const g = ctx.createGain();
      g.gain.value = vol;
      o.connect(f); f.connect(g); g.connect(audio.music);
      o.start();
    }

    audio.started = true;
    audio.nextNote = ctx.currentTime + 0.5;
    audio.timer = setInterval(audioSchedule, 200);
  } catch (err) { /* no audio device — the game plays silent */ }
}

function audioToggle() {
  if (!audio.started) { audioInit(); if (!audio.started) return; }
  audio.muted = !audio.muted;
  audio.master.gain.setTargetAtTime(audio.muted ? 0 : 0.5, audio.ctx.currentTime, 0.05);
}

function audioMood(mood) { audio.mood = mood; }

// --- the music scheduler: plucks notes a little ahead of time --------------
const SCALES = {
  explore: [146.83, 174.61, 220, 261.63, 293.66, 110, 196, 164.81], // D minor, wandering
  boss:    [73.42, 65.41, 58.27, 87.31],                            // low stabs
  ending:  [293.66, 369.99, 440, 493.88, 587.33],                   // D major, dawn
};

function audioSchedule() {
  if (!audio.started || audio.muted) return;
  const ctx = audio.ctx;
  while (audio.nextNote < ctx.currentTime + 0.6) {
    const t = Math.max(audio.nextNote, ctx.currentTime);
    const scale = SCALES[audio.mood] || SCALES.explore;
    if (audio.mood === 'boss') {
      // driving low stabs with a war-drum thump
      const n = scale[audio.beat % 2 === 0 ? 0 : 1 + (audio.beat >> 1) % 3];
      pluck(t, n, 'sawtooth', 0.09, 0.3, false);
      thump(t, 90, 0.5);
      audio.nextNote += 0.46;
    } else if (audio.mood === 'ending') {
      if (audio.beat % 2 === 0) {
        pluck(t, scale[Math.floor(Math.random() * scale.length)], 'triangle', 0.07, 2.4, true);
      }
      audio.nextNote += 1.1;
    } else {
      // sparse, lonely plucks over the drone
      if (Math.random() < 0.72) {
        pluck(t, scale[Math.floor(Math.random() * scale.length)], 'triangle', 0.055, 2.0, true);
      }
      audio.nextNote += 1.5 + Math.random() * 1.2;
    }
    audio.beat++;
  }
}

function pluck(t, freq, type, vol, decay, echo) {
  const ctx = audio.ctx;
  const o = ctx.createOscillator();
  o.type = type;
  o.frequency.value = freq;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
  o.connect(g);
  g.connect(audio.music);
  if (echo) g.connect(audio.delay);
  o.start(t); o.stop(t + decay + 0.1);
}

function thump(t, freq, vol) {
  const ctx = audio.ctx;
  const o = ctx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(35, t + 0.18);
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
  o.connect(g); g.connect(audio.music);
  o.start(t); o.stop(t + 0.25);
}

// --- sound effects -----------------------------------------------------------
function noiseBurst(t, dur, filterType, from, to, vol) {
  const ctx = audio.ctx;
  const s = ctx.createBufferSource();
  s.buffer = audio.noise;
  const f = ctx.createBiquadFilter();
  f.type = filterType;
  f.frequency.setValueAtTime(from, t);
  f.frequency.exponentialRampToValueAtTime(Math.max(to, 40), t + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(audio.sfx);
  s.start(t); s.stop(t + dur + 0.05);
}

function tone(t, from, to, type, dur, vol, dest) {
  const ctx = audio.ctx;
  const o = ctx.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(from, t);
  if (to !== from) o.frequency.exponentialRampToValueAtTime(Math.max(to, 20), t + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || audio.sfx);
  o.start(t); o.stop(t + dur + 0.05);
}

function sfx(name) {
  if (!audio.started || audio.muted) return;
  try {
    const t = audio.ctx.currentTime;
    switch (name) {
      case 'swing':
        noiseBurst(t, 0.16, 'bandpass', 2600, 500, 0.4);
        break;
      case 'hit':
        noiseBurst(t, 0.1, 'lowpass', 1800, 300, 0.5);
        tone(t, 160, 70, 'square', 0.1, 0.25);
        break;
      case 'arrow':
        noiseBurst(t, 0.1, 'highpass', 1500, 4000, 0.25);
        tone(t, 900, 300, 'sine', 0.08, 0.2);
        break;
      case 'kill':
        noiseBurst(t, 0.3, 'lowpass', 900, 120, 0.4);
        tone(t, 220, 60, 'sawtooth', 0.3, 0.2);
        break;
      case 'hurt':
        tone(t, 140, 55, 'sawtooth', 0.22, 0.4);
        noiseBurst(t, 0.15, 'lowpass', 700, 150, 0.3);
        break;
      case 'pickup':
        tone(t, 660, 660, 'sine', 0.08, 0.25);
        tone(t + 0.08, 990, 990, 'sine', 0.12, 0.25);
        break;
      case 'potion':
        for (let i = 0; i < 3; i++) tone(t + i * 0.07, 300 + i * 160, 380 + i * 160, 'sine', 0.09, 0.2);
        break;
      case 'sworddraw':
        noiseBurst(t, 0.3, 'highpass', 2500, 6500, 0.3);
        tone(t + 0.05, 1320, 1318, 'sine', 1.4, 0.18);
        tone(t + 0.05, 1980, 1975, 'sine', 1.0, 0.08);
        break;
      case 'quest':
        tone(t, 587, 587, 'triangle', 0.25, 0.25);
        tone(t + 0.18, 880, 880, 'triangle', 0.5, 0.25);
        break;
      case 'level':
        for (let i = 0; i < 4; i++) tone(t + i * 0.09, [294, 370, 440, 587][i], [294, 370, 440, 587][i], 'triangle', 0.25, 0.22);
        break;
      case 'roar':
        tone(t, 110, 40, 'sawtooth', 1.1, 0.5);
        tone(t, 165, 55, 'sawtooth', 1.1, 0.3);
        noiseBurst(t, 0.9, 'lowpass', 500, 90, 0.35);
        break;
      case 'bossdie':
        thump(t, 120, 0.8);
        tone(t, 98, 30, 'sawtooth', 1.8, 0.4);
        noiseBurst(t + 0.1, 1.4, 'lowpass', 800, 60, 0.4);
        tone(t + 0.6, 587, 587, 'sine', 2.2, 0.15);
        break;
      case 'death':
        tone(t, 330, 70, 'sawtooth', 1.3, 0.3);
        noiseBurst(t, 0.8, 'lowpass', 600, 80, 0.3);
        break;
      case 'bolt':
        noiseBurst(t, 0.18, 'bandpass', 500, 1600, 0.2);
        tone(t, 240, 480, 'sine', 0.15, 0.15);
        break;
    }
  } catch (err) { /* never let a sound break the game */ }
}
'use strict';

// ---------------------------------------------------------------------------
// The world of Emberfall: a 96x96 tile map generated deterministically.
// Layout: village in the center-south, three sigil ruins (west / east / south),
// and the cursed castle of King Maldrich in the north.
// ---------------------------------------------------------------------------

const TILE = 32;
const MW = 96;
const MH = 96;

const T = { GRASS: 0, TREE: 1, WATER: 2, WALL: 3, FLOOR: 4, PATH: 5, GATE: 6 };

const world = {
  map: new Uint8Array(MW * MH),
  lights: [],     // {x, y, r, warm} static light sources
  decors: [],     // {x, y, kind} campfire / braziers / gravestones
  spawns: [],     // {x, y, type} enemy spawn points
  pickups: [],    // {x, y, type, val}
  npcs: [],       // {x, y, name, kind}
  lores: [],      // {x, y, text} readable standing stones
  gateTiles: [],
  dungeons: [],   // {x, y, id, name} first-person dungeon entrances (unused in the simple quest)
  shrine: { x: 0, y: 0, taken: false }, // the sword in the stone
  playerSpawn: { x: 0, y: 0 },
  bossSpawn: { x: 0, y: 0 },
  village: { tx: 48, ty: 62 },
};

function getT(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) return T.WALL;
  return world.map[ty * MW + tx];
}

function setT(tx, ty, t) {
  if (tx >= 0 && ty >= 0 && tx < MW && ty < MH) world.map[ty * MW + tx] = t;
}

function px(tx) { return tx * TILE + TILE / 2; } // tile center in pixels

function genWorld() {
  const rng = mulberry32(20260831);
  world.lights.length = 0;
  world.decors.length = 0;
  world.spawns.length = 0;
  world.pickups.length = 0;
  world.npcs.length = 0;
  world.lores.length = 0;
  world.gateTiles.length = 0;
  world.dungeons.length = 0;
  world.map.fill(T.GRASS);

  // --- mountains ring the edge of the world ---
  for (let i = 0; i < MW; i++) {
    for (let b = 0; b < 3; b++) {
      setT(i, b, T.WALL); setT(i, MH - 1 - b, T.WALL);
      setT(b, i, T.WALL); setT(MW - 1 - b, i, T.WALL);
    }
  }

  // --- lakes: a few blobby random walks ---
  for (let l = 0; l < 4; l++) {
    let lx = 10 + Math.floor(rng() * (MW - 20));
    let ly = 30 + Math.floor(rng() * (MH - 45));
    for (let s = 0; s < 50; s++) {
      for (let dx = -1; dx <= 1; dx++)
        for (let dy = -1; dy <= 1; dy++)
          if (getT(lx + dx, ly + dy) === T.GRASS) setT(lx + dx, ly + dy, T.WATER);
      lx += Math.floor(rng() * 3) - 1;
      ly += Math.floor(rng() * 3) - 1;
      lx = clamp(lx, 5, MW - 6); ly = clamp(ly, 5, MH - 6);
    }
  }

  // --- forests: many small tree clusters ---
  for (let c = 0; c < 300; c++) {
    const cx = 4 + Math.floor(rng() * (MW - 8));
    const cy = 4 + Math.floor(rng() * (MH - 8));
    const rad = 1 + Math.floor(rng() * 3);
    for (let dx = -rad; dx <= rad; dx++) {
      for (let dy = -rad; dy <= rad; dy++) {
        if (dx * dx + dy * dy <= rad * rad && rng() < 0.65 &&
            getT(cx + dx, cy + dy) === T.GRASS) {
          setT(cx + dx, cy + dy, T.TREE);
        }
      }
    }
  }

  // --- scattered gravestones for atmosphere (denser in the south) ---
  for (let g = 0; g < 40; g++) {
    const gx = 6 + Math.floor(rng() * (MW - 12));
    const gy = 40 + Math.floor(rng() * (MH - 46));
    if (getT(gx, gy) === T.GRASS) {
      world.decors.push({ x: px(gx), y: px(gy), kind: 'grave' });
    }
  }

  // --- the village: a cleared circle with a campfire ---
  const V = world.village;
  for (let dx = -8; dx <= 8; dx++) {
    for (let dy = -8; dy <= 8; dy++) {
      if (dx * dx + dy * dy <= 64) setT(V.tx + dx, V.ty + dy, T.GRASS);
    }
  }
  for (let dx = -2; dx <= 2; dx++)
    for (let dy = -2; dy <= 2; dy++)
      setT(V.tx + dx, V.ty + dy, T.PATH);
  world.decors.push({ x: px(V.tx), y: px(V.ty), kind: 'campfire' });
  world.lights.push({ x: px(V.tx), y: px(V.ty), r: 170, warm: true });
  world.playerSpawn = { x: px(V.tx), y: px(V.ty + 3) };

  world.npcs.push({ x: px(V.tx - 2), y: px(V.ty - 1), name: 'Elder Rowena', kind: 'elder' });
  world.npcs.push({ x: px(V.tx + 2), y: px(V.ty - 1), name: 'Trader Osric', kind: 'trader' });

  // the sword in the stone, on the village's eastern edge
  setT(V.tx + 6, V.ty, T.GRASS);
  world.shrine = { x: px(V.tx + 6), y: px(V.ty), taken: false };
  world.decors.push({ x: px(V.tx + 6), y: px(V.ty), kind: 'shrine' });
  world.lights.push({ x: px(V.tx + 6), y: px(V.ty), r: 110, warm: false });

  // --- three sigil ruins ---
  const ruins = [
    { tx: 16, ty: 48 }, // west woods
    { tx: 80, ty: 48 }, // eastern marsh
    { tx: 48, ty: 84 }, // southern gravehill
  ];
  for (const r of ruins) makeRuin(r.tx, r.ty, rng);

  // --- the castle of the Fallen King ---
  const CX0 = 36, CX1 = 60, CY0 = 6, CY1 = 26;
  for (let tx = CX0; tx <= CX1; tx++) {
    for (let ty = CY0; ty <= CY1; ty++) {
      const edge = tx === CX0 || tx === CX1 || ty === CY0 || ty === CY1;
      setT(tx, ty, edge ? T.WALL : T.FLOOR);
    }
  }
  for (let tx = 47; tx <= 49; tx++) {
    setT(tx, CY1, T.GATE);
    world.gateTiles.push({ tx, ty: CY1 });
  }
  // throne dais
  for (let tx = 46; tx <= 50; tx++)
    for (let ty = CY0 + 2; ty <= CY0 + 5; ty++)
      setT(tx, ty, T.PATH);
  world.bossSpawn = { x: px(48), y: px(CY0 + 4) };
  for (const [lx, ly] of [[38, 8], [58, 8], [38, 24], [58, 24], [44, 8], [52, 8]]) {
    world.decors.push({ x: px(lx), y: px(ly), kind: 'brazier' });
    world.lights.push({ x: px(lx), y: px(ly), r: 130, warm: true });
  }

  // --- paths from the village to every point of interest ---
  carvePath(V.tx, V.ty - 3, 48, CY1 + 1);        // the North Road, to the castle gate
  carvePath(V.tx - 3, V.ty, ruins[0].tx, ruins[0].ty + 5); // west ruin
  carvePath(V.tx + 3, V.ty, ruins[1].tx, ruins[1].ty + 5); // east ruin
  carvePath(V.tx, V.ty + 3, ruins[2].tx, ruins[2].ty + 5); // south ruin

  // --- the scenic North Road: paired lantern posts make a corridor of light ---
  for (let ly = 28; ly <= 58; ly += 3) {
    for (const side of [46, 51]) {
      setT(side, ly, T.GRASS);
      world.decors.push({ x: px(side), y: px(ly), kind: 'lantern' });
      world.lights.push({ x: px(side), y: px(ly), r: 135, warm: true });
    }
  }

  // --- lore stones (now pure scenery and story) ---
  addLore(34, 56, 'Here fell Ser Adric, who rode north and did not return. "The crown is cursed," they told him. He laughed.');
  addLore(62, 72, 'When the sun guttered out, King Maldrich swore he would buy it back with blood. The blood he spent was ours.');
  addLore(50, 38, 'A traveler’s mark: "From this bend you can see the whole road home. Rest here. The gate will still be there."');

  // --- enemies (a gentle land now — the real fight waits on the throne) ---
  // a few wolves in the far wilds
  let placed = 0, guard = 0;
  while (placed < 8 && guard++ < 4000) {
    const tx = 6 + Math.floor(rng() * (MW - 12));
    const ty = 30 + Math.floor(rng() * (MH - 36));
    const far = Math.hypot(tx - V.tx, ty - V.ty) > 20;
    if (far && getT(tx, ty) === T.GRASS) {
      world.spawns.push({ x: px(tx), y: px(ty), type: 'wolf' });
      placed++;
    }
  }
  // a couple of skeletons dozing at each ruin
  for (const r of ruins) {
    for (const [ox, oy] of [[-7, 0], [0, 7]]) {
      const tx = r.tx + ox, ty = r.ty + oy;
      if (getT(tx, ty) !== T.WALL && getT(tx, ty) !== T.WATER) {
        world.spawns.push({ x: px(tx), y: px(ty), type: 'skeleton' });
      }
    }
  }
  // one lone wraith drifts off the road's edge — a taste of what waits north
  world.spawns.push({ x: px(44), y: px(36), type: 'wraith' });
  // a thin honor guard inside the castle
  for (const [tx, ty] of [[42, 12], [54, 12]]) {
    world.spawns.push({ x: px(tx), y: px(ty), type: 'skeleton' });
  }
  world.spawns.push({ x: world.bossSpawn.x, y: world.bossSpawn.y, type: 'boss' });

  // --- treasure scattered in the wilds ---
  placed = 0; guard = 0;
  while (placed < 12 && guard++ < 4000) {
    const tx = 6 + Math.floor(rng() * (MW - 12));
    const ty = 30 + Math.floor(rng() * (MH - 36));
    if (getT(tx, ty) === T.GRASS && Math.hypot(tx - V.tx, ty - V.ty) > 10) {
      world.pickups.push({ x: px(tx), y: px(ty), type: 'gold', val: 4 + Math.floor(rng() * 6) });
      placed++;
    }
  }
  // quivers of arrows left by less fortunate travelers
  placed = 0; guard = 0;
  while (placed < 8 && guard++ < 4000) {
    const tx = 6 + Math.floor(rng() * (MW - 12));
    const ty = 28 + Math.floor(rng() * (MH - 34));
    if (getT(tx, ty) === T.GRASS && Math.hypot(tx - V.tx, ty - V.ty) > 8) {
      world.pickups.push({ x: px(tx), y: px(ty), type: 'arrows', val: 5 });
      placed++;
    }
  }
}

function makeRuin(cx, cy, rng) {
  const w = 5, h = 4;
  for (let tx = cx - w; tx <= cx + w; tx++) {
    for (let ty = cy - h; ty <= cy + h; ty++) {
      const edge = tx === cx - w || tx === cx + w || ty === cy - h || ty === cy + h;
      setT(tx, ty, edge && rng() < 0.7 ? T.WALL : T.FLOOR);
    }
  }
  // guaranteed south entrance
  setT(cx, cy + h, T.FLOOR);
  setT(cx + 1, cy + h, T.FLOOR);
  // corner braziers still burning after all these years
  for (const [ox, oy] of [[-w + 1, -h + 1], [w - 1, -h + 1], [-w + 1, h - 1], [w - 1, h - 1]]) {
    world.decors.push({ x: px(cx + ox), y: px(cy + oy), kind: 'brazier' });
    world.lights.push({ x: px(cx + ox), y: px(cy + oy), r: 110, warm: true });
  }
  world.pickups.push({ x: px(cx - 3), y: px(cy - 2), type: 'potion' });
}

// Carve a 2-wide L-shaped dirt path (x leg, then y leg). Only soft terrain
// (grass / trees / water) is overwritten, so walls stay intact.
function carvePath(x0, y0, x1, y1) {
  const soft = (t) => t === T.GRASS || t === T.TREE || t === T.WATER;
  const put = (tx, ty) => {
    for (let dx = 0; dx < 2; dx++)
      for (let dy = 0; dy < 2; dy++)
        if (soft(getT(tx + dx, ty + dy))) setT(tx + dx, ty + dy, T.PATH);
  };
  let x = x0, y = y0;
  while (x !== x1) { put(x, y); x += x < x1 ? 1 : -1; }
  while (y !== y1) { put(x, y); y += y < y1 ? 1 : -1; }
  put(x, y);
}

function addLore(tx, ty, text) {
  setT(tx, ty, T.GRASS);
  world.lores.push({ x: px(tx), y: px(ty), text });
}
'use strict';

function makePlayer(x, y) {
  return {
    x, y, r: 10,
    hp: 200, maxHp: 200,
    dmg: 15, speed: 165,
    face: -Math.PI / 2,        // facing angle (starts looking north)
    hasSword: false,           // the old blade waits in the stone
    level: 1, xp: 0, xpNext: 40,
    gold: 0, potions: 2, sigils: 0,
    arrows: 25, bowCd: 0,
    atkCd: 0, swing: 0, swingDir: 0,
    dodgeCd: 0, dodging: 0, dodgeDirX: 0, dodgeDirY: 0,
    inv: 0,                     // invulnerability time after a hit / dodge
    lastHurt: 99,               // seconds since last damage (drives regen)
  };
}

const ENEMY_TYPES = {
  wolf:     { hp: 20,  dmg: 5,  speed: 120, aggro: 200, xp: 12,  r: 10 },
  skeleton: { hp: 35,  dmg: 8,  speed: 80,  aggro: 190, xp: 22,  r: 11 },
  wraith:   { hp: 30,  dmg: 8,  speed: 100, aggro: 250, xp: 32,  r: 11, ghost: true },
  boss:     { hp: 300, dmg: 16, speed: 110, aggro: 330, xp: 200, r: 18, boss: true },
};

function makeEnemy(x, y, type) {
  const s = ENEMY_TYPES[type];
  return {
    x, y, type,
    r: s.r, hp: s.hp, hpMax: s.hp,
    dmg: s.dmg, speed: s.speed, aggro: s.aggro, xp: s.xp,
    ghost: !!s.ghost, boss: !!s.boss,
    homeX: x, homeY: y,
    wanderT: 0, wx: 0, wy: 0,   // wander timer + direction
    touchCd: 0,                  // cooldown between contact hits
    fireT: 1 + Math.random(),    // wraith shadow-bolt timer
    volleyT: 2,                  // boss volley timer
    kx: 0, ky: 0,                // knockback velocity
    hurtT: 0,                    // hit-flash timer
    aggroed: false,
    chargeT: 3, charging: 0, chDirX: 0, chDirY: 0, // boss charge attack
    spawnedAdds: false,
    dead: false,
  };
}
'use strict';

// ---------------------------------------------------------------------------
// FIRST-PERSON DUNGEONS — a raycasting renderer (Wolfenstein-style DDA).
// Descending a stairway switches the game from top-down to a claustrophobic
// first-person view: fog, torchlight, billboard monsters, chests, a relic.
// ---------------------------------------------------------------------------

const DG_DEFS = {
  barrow:  { name: 'Barrow of the Pale Count', wall: [82, 96, 132],  fogFloor: '#0a0c14', seed: 411 },
  ossuary: { name: 'The Ossuary',              wall: [128, 112, 84], fogFloor: '#100c08', seed: 902 },
};

const DG_SIZE = 21;
const DG_ENEMY = {
  skeleton: { hp: 45, dmg: 10, speed: 1.15, xp: 20 },
  wraith:   { hp: 40, dmg: 13, speed: 1.55, xp: 28 },
};

let dungeonStates = {}; // persisted per game so cleared halls stay cleared
let dg = null;          // active dungeon state
let dgFloaters = [];    // screen-space loot/xp text in the dungeon

function resetDungeons() { dungeonStates = {}; dg = null; dgFloaters = []; }

function dgAt(g, x, y) {
  if (x < 0 || y < 0 || x >= DG_SIZE || y >= DG_SIZE) return 1;
  return g[y * DG_SIZE + x];
}

function genDungeon(id) {
  const def = DG_DEFS[id];
  const rng = mulberry32(def.seed);
  const grid = new Uint8Array(DG_SIZE * DG_SIZE).fill(1);

  // drunkard-walk carving from the entry, plus a few stamped rooms
  let x = 2, y = 2;
  grid[y * DG_SIZE + x] = 0;
  for (let s = 0; s < 900; s++) {
    const r = rng();
    if (r < 0.25 && x > 1) x--;
    else if (r < 0.5 && x < DG_SIZE - 2) x++;
    else if (r < 0.75 && y > 1) y--;
    else if (y < DG_SIZE - 2) y++;
    grid[y * DG_SIZE + x] = 0;
  }
  for (let room = 0; room < 4; room++) {
    const rx = 2 + Math.floor(rng() * (DG_SIZE - 7));
    const ry = 2 + Math.floor(rng() * (DG_SIZE - 7));
    for (let dx = 0; dx < 3 + Math.floor(rng() * 2); dx++)
      for (let dy = 0; dy < 3; dy++)
        grid[(ry + dy) * DG_SIZE + (rx + dx)] = 0;
  }
  grid[2 * DG_SIZE + 2] = 0;

  // open cells sorted by distance from the entry — loot goes deep
  const open = [];
  for (let ty = 1; ty < DG_SIZE - 1; ty++)
    for (let tx = 1; tx < DG_SIZE - 1; tx++)
      if (dgAt(grid, tx, ty) === 0) open.push({ x: tx + 0.5, y: ty + 0.5, d: Math.hypot(tx - 2, ty - 2) });
  open.sort((a, b) => a.d - b.d);

  const far = (frac) => open[Math.min(open.length - 1, Math.floor(open.length * frac))];

  const sprites = [
    { kind: 'stairs', x: 2.5, y: 2.5 },
    { kind: 'chest', x: far(0.55).x, y: far(0.55).y, loot: 'gold', opened: false },
    { kind: 'chest', x: far(0.75).x, y: far(0.75).y, loot: 'supplies', opened: false },
    { kind: 'chest', x: far(0.999).x, y: far(0.999).y, loot: 'relic', opened: false },
  ];
  for (let b = 0; b < 6; b++) {
    const c = open[Math.floor(rng() * open.length)];
    sprites.push({ kind: 'brazier', x: c.x, y: c.y });
  }

  const enemies = [];
  const mix = id === 'barrow' ? ['skeleton', 'skeleton', 'skeleton', 'skeleton', 'wraith', 'wraith']
                              : ['skeleton', 'skeleton', 'skeleton', 'wraith', 'wraith', 'wraith'];
  for (const type of mix) {
    let c = null, guard = 0;
    do { c = open[Math.floor(rng() * open.length)]; } while (c.d < 5 && guard++ < 60);
    const s = DG_ENEMY[type];
    enemies.push({
      x: c.x, y: c.y, type, hp: s.hp, hpMax: s.hp, dmg: s.dmg,
      speed: s.speed, xp: s.xp, touchCd: 0, hurtT: 0, dead: false,
    });
  }

  return { id, def, grid, sprites, enemies, darts: [] };
}

function enterDungeon(info) {
  if (!dungeonStates[info.id]) dungeonStates[info.id] = genDungeon(info.id);
  dg = dungeonStates[info.id];
  dg.px = 2.5; dg.py = 2.5; dg.ang = Math.PI / 4;
  dg.swingT = 0; dg.walk = 0; dg.returnX = info.x; dg.returnY = info.y + 26;
  dgFloaters = [];
  interactTarget = null;
  mode = 'dungeon';
  banner.txt = dg.def.name; banner.ttl = 3.2; banner.last = '';
  if (!getQuest('relics')) {
    addQuest('relics', 'Bones Below', 'Two relics lie in the deep places of Emberfall — the Barrow and the Ossuary. Claim them both.');
    getQuest('relics').goal = 2;
  }
  msg('A / D turn — W / S walk — click to strike or shoot — E to open and ascend.');
}

function dgSolid(x, y) {
  const r = 0.22;
  return dgAt(dg.grid, Math.floor(x - r), Math.floor(y - r)) ||
         dgAt(dg.grid, Math.floor(x + r), Math.floor(y - r)) ||
         dgAt(dg.grid, Math.floor(x - r), Math.floor(y + r)) ||
         dgAt(dg.grid, Math.floor(x + r), Math.floor(y + r));
}

function dgFloat(txt, color) { dgFloaters.push({ txt, color, ttl: 1.6 }); }

function dungeonUpdate(dt) {
  const p = player;

  // turning + walking
  const turn = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
  dg.ang += turn * 2.6 * dt;
  const fwd = (keys['w'] || keys['arrowup'] ? 1 : 0) - (keys['s'] || keys['arrowdown'] ? 1 : 0);
  if (fwd) {
    const sp = 2.6 * fwd * dt;
    const nx = dg.px + Math.cos(dg.ang) * sp;
    const ny = dg.py + Math.sin(dg.ang) * sp;
    if (!dgSolid(nx, dg.py)) dg.px = nx;
    if (!dgSolid(dg.px, ny)) dg.py = ny;
    dg.walk += dt * Math.abs(fwd);
  }
  dg.swingT = Math.max(0, dg.swingT - dt);

  // strike (close) or loose an arrow (far)
  if ((mouseClicked || pressed[' ']) && p.atkCd <= 0) {
    let target = null, bd = 1.5;
    for (const e of dg.enemies) {
      if (e.dead) continue;
      const d = Math.hypot(e.x - dg.px, e.y - dg.py);
      const a = Math.atan2(e.y - dg.py, e.x - dg.px);
      if (d < bd && Math.abs(angDiff(dg.ang, a)) < 0.75) { target = e; bd = d; }
    }
    if (target) {
      p.atkCd = 0.45;
      dg.swingT = 0.2;
      dgHitEnemy(target, p.dmg);
      const a = Math.atan2(target.y - dg.py, target.x - dg.px);
      const kx = target.x + Math.cos(a) * 0.35, ky = target.y + Math.sin(a) * 0.35;
      if (!dgSolid(kx, ky)) { target.x = kx; target.y = ky; }
    } else if (p.arrows > 0) {
      p.atkCd = 0.42;
      p.arrows--;
      dg.swingT = 0.12;
      dg.darts.push({
        x: dg.px + Math.cos(dg.ang) * 0.35, y: dg.py + Math.sin(dg.ang) * 0.35,
        vx: Math.cos(dg.ang) * 9, vy: Math.sin(dg.ang) * 9, ttl: 1.4,
      });
    } else {
      p.atkCd = 0.42;
      dg.swingT = 0.2;
      if (mouseClicked) msg('Nothing in reach — and no arrows to loose.');
    }
  }

  // arrows in flight
  for (const dart of dg.darts) {
    dart.ttl -= dt;
    dart.x += dart.vx * dt;
    dart.y += dart.vy * dt;
    if (dgAt(dg.grid, Math.floor(dart.x), Math.floor(dart.y))) { dart.ttl = 0; continue; }
    for (const e of dg.enemies) {
      if (e.dead) continue;
      if (Math.hypot(e.x - dart.x, e.y - dart.y) < 0.4) {
        dart.ttl = 0;
        dgHitEnemy(e, Math.max(6, Math.round(p.dmg * 0.75)));
        break;
      }
    }
  }
  dg.darts = dg.darts.filter((d) => d.ttl > 0);

  // the dead things walk
  for (const e of dg.enemies) {
    if (e.dead) continue;
    e.touchCd = Math.max(0, e.touchCd - dt);
    e.hurtT = Math.max(0, e.hurtT - dt);
    const d = Math.hypot(dg.px - e.x, dg.py - e.y);
    if (d < 7 && d > 0.55) {
      const a = Math.atan2(dg.py - e.y, dg.px - e.x);
      const nx = e.x + Math.cos(a) * e.speed * dt;
      const ny = e.y + Math.sin(a) * e.speed * dt;
      if (!dgSolid(nx, e.y)) e.x = nx;
      if (!dgSolid(e.x, ny)) e.y = ny;
    }
    if (d < 0.7 && e.touchCd <= 0 && p.inv <= 0) {
      e.touchCd = 0.9;
      p.hp -= e.dmg;
      p.inv = 0.6;
      p.lastHurt = 0;
      shake = 6;
      dgFloat('-' + e.dmg, '#e86060');
    }
  }

  // interact: chests and the way out
  if (pressed['e']) {
    let used = false;
    for (const s of dg.sprites) {
      const d = Math.hypot(s.x - dg.px, s.y - dg.py);
      if (s.kind === 'chest' && !s.opened && d < 1.1) {
        s.opened = true;
        used = true;
        openChest(s);
        break;
      }
      if (s.kind === 'stairs' && d < 1.1) {
        used = true;
        leaveDungeon();
        break;
      }
    }
    if (!used) { /* nothing near — the dark keeps its secrets */ }
  }

  for (const f of dgFloaters) f.ttl -= dt;
  dgFloaters = dgFloaters.filter((f) => f.ttl > 0);
}

function dgHitEnemy(e, dmg) {
  e.hp -= dmg;
  e.hurtT = 0.15;
  dgFloat(dmg + '', '#f0e6c8');
  if (e.hp <= 0) {
    e.dead = true;
    gainXp(e.xp);
    const g = 2 + Math.floor(Math.random() * 5);
    player.gold += g;
    dgFloat('+' + e.xp + ' xp   +' + g + 'g', '#b48ce8');
  }
}

function openChest(s) {
  if (s.loot === 'relic') {
    player.dmg += 4;
    const q = getQuest('relics');
    q.count++;
    msg('A relic of the old order — your blade drinks its weight. (+4 damage)');
    if (q.count >= q.goal) {
      completeQuest('relics');
      player.maxHp += 20;
      player.hp = player.maxHp;
      msg('Both relics hum in your pack. You feel unbreakable. (+20 max health)');
    }
  } else if (s.loot === 'supplies') {
    player.potions += 2;
    player.arrows += 8;
    msg('Inside: two potions and a bundle of arrows, dry after all these years.');
  } else {
    const g = 15 + Math.floor(Math.random() * 16);
    player.gold += g;
    msg('Old coin, older dust — ' + g + ' gold.');
  }
}

function leaveDungeon() {
  mode = 'overworld';
  player.x = dg.returnX;
  player.y = dg.returnY;
  banner.last = '';
  msg('You climb back into the night air.');
}

// ---------------------------------------------------------------------------
// RENDERING — DDA raycaster + billboard sprites + a sword in your hands.
// ---------------------------------------------------------------------------
function dungeonDraw() {
  const w = canvas.width, h = canvas.height;
  const colW = 2;
  const dirX = Math.cos(dg.ang), dirY = Math.sin(dg.ang);
  const planeX = -dirY * 0.66, planeY = dirX * 0.66;
  const flicker = 0.92 + Math.sin(time * 9) * 0.05 + Math.sin(time * 23) * 0.03;
  const [wr, wg, wb] = dg.def.wall;

  // ceiling and floor
  let grad = ctx.createLinearGradient(0, 0, 0, h / 2);
  grad.addColorStop(0, '#030308');
  grad.addColorStop(1, '#000000');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h / 2);
  grad = ctx.createLinearGradient(0, h / 2, 0, h);
  grad.addColorStop(0, '#000000');
  grad.addColorStop(1, dg.def.fogFloor);
  ctx.fillStyle = grad;
  ctx.fillRect(0, h / 2, w, h / 2);

  // walls
  const zbuf = new Float32Array(Math.ceil(w / colW));
  for (let c = 0; c < w; c += colW) {
    const cameraX = (2 * c) / w - 1;
    const rx = dirX + planeX * cameraX;
    const ry = dirY + planeY * cameraX;
    let mapX = Math.floor(dg.px), mapY = Math.floor(dg.py);
    const ddx = Math.abs(1 / (rx || 1e-9)), ddy = Math.abs(1 / (ry || 1e-9));
    let stepX, stepY, sideX, sideY;
    if (rx < 0) { stepX = -1; sideX = (dg.px - mapX) * ddx; } else { stepX = 1; sideX = (mapX + 1 - dg.px) * ddx; }
    if (ry < 0) { stepY = -1; sideY = (dg.py - mapY) * ddy; } else { stepY = 1; sideY = (mapY + 1 - dg.py) * ddy; }
    let side = 0, guard = 0;
    while (guard++ < 64) {
      if (sideX < sideY) { sideX += ddx; mapX += stepX; side = 0; }
      else { sideY += ddy; mapY += stepY; side = 1; }
      if (dgAt(dg.grid, mapX, mapY)) break;
    }
    const dist = side === 0 ? sideX - ddx : sideY - ddy;
    zbuf[c / colW] = dist;
    const lineH = Math.min(h * 2.2, h / Math.max(dist, 0.05));
    // where along the wall block this ray landed — gives blocks visible seams
    const wallX = side === 0 ? dg.py + dist * ry : dg.px + dist * rx;
    const frac = wallX - Math.floor(wallX);
    let shade = clamp(1.35 / (1 + dist * 0.5), 0.03, 1) * flicker * (side ? 0.72 : 1);
    if (frac < 0.06 || frac > 0.94) shade *= 0.62;
    ctx.fillStyle = 'rgb(' + Math.round(wr * shade) + ',' + Math.round(wg * shade) + ',' + Math.round(wb * shade) + ')';
    ctx.fillRect(c, (h - lineH) / 2, colW, lineH);
  }

  // sprites, farthest first
  const list = [];
  for (const s of dg.sprites) list.push(s);
  for (const e of dg.enemies) if (!e.dead) list.push(e);
  for (const dart of dg.darts) list.push({ kind: 'dart', x: dart.x, y: dart.y });
  const proj = [];
  const invDet = 1 / (planeX * dirY - dirX * planeY);
  for (const s of list) {
    const sx = s.x - dg.px, sy = s.y - dg.py;
    const tX = invDet * (dirY * sx - dirX * sy);
    const tY = invDet * (-planeY * sx + planeX * sy);
    if (tY <= 0.15) continue;
    proj.push({ s, tX, tY });
  }
  proj.sort((a, b) => b.tY - a.tY);
  for (const pr of proj) {
    const { s, tX, tY } = pr;
    const screenX = (w / 2) * (1 + tX / tY);
    const col = Math.floor(screenX / colW);
    if (col >= 0 && col < zbuf.length && zbuf[col] < tY - 0.15) continue; // behind a wall
    const size = h / tY;
    const floorY = h / 2 + size / 2;
    const shade = clamp(1.4 / (1 + tY * 0.42), 0.1, 1) * flicker;
    drawDgSprite(s, screenX, floorY, size, shade);
  }

  drawDgWeapon(w, h);

  // crosshair
  ctx.strokeStyle = 'rgba(232,223,192,0.6)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(w / 2 - 6, h / 2); ctx.lineTo(w / 2 - 2, h / 2);
  ctx.moveTo(w / 2 + 2, h / 2); ctx.lineTo(w / 2 + 6, h / 2);
  ctx.moveTo(w / 2, h / 2 - 6); ctx.lineTo(w / 2, h / 2 - 2);
  ctx.moveTo(w / 2, h / 2 + 2); ctx.lineTo(w / 2, h / 2 + 6);
  ctx.stroke();

  // hurt flash
  if (player.inv > 0.35) {
    ctx.fillStyle = 'rgba(160,20,20,' + (player.inv - 0.35) * 0.8 + ')';
    ctx.fillRect(0, 0, w, h);
  }

  // interact hint
  let hint = '';
  for (const s of dg.sprites) {
    const d = Math.hypot(s.x - dg.px, s.y - dg.py);
    if (s.kind === 'chest' && !s.opened && d < 1.1) hint = '[E]  Open the chest';
    else if (s.kind === 'stairs' && d < 1.1) hint = '[E]  Ascend to the surface';
  }
  if (hint) {
    ctx.textAlign = 'center';
    ctx.font = '15px Georgia, serif';
    ctx.fillStyle = '#f0e6c8';
    ctx.fillText(hint, w / 2, h - 96);
  }

  // floating combat text, stacked above the crosshair
  ctx.textAlign = 'center';
  ctx.font = 'bold 15px Georgia, serif';
  let fy = h / 2 - 50;
  for (let i = dgFloaters.length - 1; i >= 0; i--) {
    const f = dgFloaters[i];
    ctx.globalAlpha = Math.min(1, f.ttl);
    ctx.fillStyle = f.color;
    ctx.fillText(f.txt, w / 2, fy - (1.6 - f.ttl) * 24);
    fy -= 20;
  }
  ctx.globalAlpha = 1;

  drawVignette();
}

function drawDgSprite(s, x, floorY, size, shade) {
  ctx.save();
  ctx.translate(x, floorY);
  ctx.scale(size / 100, size / 100); // painters work in a 100-unit box
  ctx.globalAlpha = shade;

  if (s.kind === 'brazier') {
    ctx.fillStyle = '#3a3a44';
    ctx.fillRect(-10, -28, 20, 24);
    ctx.fillRect(-14, -32, 28, 6);
    const fl = Math.sin(time * 11 + s.x * 7) * 4;
    ctx.fillStyle = '#e87828';
    ctx.beginPath();
    ctx.moveTo(-10, -32);
    ctx.quadraticCurveTo(0, -62 - fl, 10, -32);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f8c840';
    ctx.beginPath();
    ctx.moveTo(-4, -32);
    ctx.quadraticCurveTo(0, -48 - fl, 4, -32);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = shade * 0.35;
    const g = ctx.createRadialGradient(0, -44, 0, 0, -44, 60);
    g.addColorStop(0, 'rgba(240,150,50,0.8)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(-60, -104, 120, 120);
  } else if (s.kind === 'stairs') {
    ctx.fillStyle = '#1a1c26';
    ctx.fillRect(-26, -66, 52, 66);
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = 'rgba(150,160,190,' + (0.5 - i * 0.11) + ')';
      ctx.fillRect(-20 + i * 3, -12 - i * 14, 40 - i * 6, 8);
    }
    ctx.fillStyle = 'rgba(190,210,255,0.25)';
    ctx.fillRect(-10, -66, 20, 10);
  } else if (s.kind === 'chest') {
    if (s.opened) {
      ctx.fillStyle = '#3a2c1a';
      ctx.fillRect(-18, -20, 36, 20);
      ctx.fillStyle = '#241a0e';
      ctx.fillRect(-16, -18, 32, 10);
    } else {
      ctx.fillStyle = '#4a3820';
      ctx.fillRect(-18, -28, 36, 28);
      ctx.fillStyle = '#5c4628';
      ctx.fillRect(-18, -28, 36, 10);
      ctx.fillStyle = '#c8a850';
      ctx.fillRect(-18, -17, 36, 3);
      ctx.fillRect(-3, -16, 6, 8);
      if (s.loot === 'relic') {
        ctx.fillStyle = 'rgba(143,214,232,' + (0.4 + Math.sin(time * 4) * 0.2) + ')';
        ctx.fillRect(-4, -40, 8, 8);
      }
    }
  } else if (s.kind === 'dart') {
    ctx.fillStyle = '#f4ecd0';
    ctx.fillRect(-3, -52, 6, 6);
  } else if (s.type === 'skeleton') {
    const flash = s.hurtT > 0;
    const sway = Math.sin(time * 6 + s.x * 5) * 3;
    ctx.fillStyle = flash ? '#ffffff' : '#c8c2b0';
    ctx.fillRect(-4 + sway / 2, -46, 8, 26);       // spine
    ctx.fillRect(-16 + sway / 2, -42, 32, 4);      // ribs
    ctx.fillRect(-14 + sway / 2, -34, 28, 4);
    ctx.fillRect(-12 + sway / 2, -26, 24, 4);
    ctx.fillStyle = flash ? '#ffffff' : '#d8d2c0';
    ctx.beginPath(); ctx.arc(sway / 2, -56, 12, 0, Math.PI * 2); ctx.fill(); // skull
    ctx.fillStyle = '#141418';
    ctx.fillRect(-7 + sway / 2, -60, 5, 6);
    ctx.fillRect(2 + sway / 2, -60, 5, 6);
    ctx.fillRect(-4 + sway / 2, -50, 8, 3);
    ctx.strokeStyle = flash ? '#ffffff' : '#a8a290'; // legs + blade
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-4, -20); ctx.lineTo(-8, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, -20); ctx.lineTo(8, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(14, -34); ctx.lineTo(30, -50); ctx.stroke();
    if (s.hp < s.hpMax) dgHpBar(s);
  } else if (s.type === 'wraith') {
    const flash = s.hurtT > 0;
    const bob = Math.sin(time * 3 + s.x * 5) * 5;
    ctx.globalAlpha *= 0.8;
    ctx.fillStyle = flash ? '#d8f0f8' : '#26364a';
    ctx.beginPath();
    ctx.moveTo(0, -70 + bob);
    ctx.quadraticCurveTo(-28, -40 + bob, -20, 0);
    ctx.quadraticCurveTo(0, -16 + bob / 2, 20, 0);
    ctx.quadraticCurveTo(28, -40 + bob, 0, -70 + bob);
    ctx.fill();
    ctx.fillStyle = '#8fd6e8';
    ctx.fillRect(-9, -52 + bob, 5, 7);
    ctx.fillRect(4, -52 + bob, 5, 7);
    if (s.hp < s.hpMax) dgHpBar(s);
  }
  ctx.restore();
}

function dgHpBar(s) {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(-16, -80, 32, 4);
  ctx.fillStyle = '#c04848';
  ctx.fillRect(-16, -80, 32 * (s.hp / s.hpMax), 4);
}

// The knight's sword, held low and ready at the bottom of the screen.
function drawDgWeapon(w, h) {
  const bob = Math.sin(dg.walk * 7) * 8;
  const prog = dg.swingT > 0 ? 1 - dg.swingT / 0.2 : 0;
  const swing = prog > 0 ? Math.sin(prog * Math.PI) : 0;
  ctx.save();
  ctx.translate(w * 0.74 - swing * w * 0.22, h + bob - swing * 60);
  ctx.rotate(-0.5 - swing * 0.9);
  // blade
  const g = ctx.createLinearGradient(0, -300, 0, 0);
  g.addColorStop(0, '#dfe4ee');
  g.addColorStop(1, '#8a93a6');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-11, -60);
  ctx.lineTo(-4, -310);
  ctx.lineTo(4, -310);
  ctx.lineTo(11, -60);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; // edge highlight
  ctx.fillRect(-2, -308, 3, 250);
  // guard + grip
  ctx.fillStyle = '#c8a850';
  ctx.fillRect(-30, -62, 60, 10);
  ctx.fillStyle = '#3a2c1a';
  ctx.fillRect(-8, -52, 16, 60);
  ctx.restore();
}
'use strict';

// ---------------------------------------------------------------------------
// FIRST-PERSON OVERWORLD — the whole of Emberfall through the knight's eyes.
// Raycasts the world map (trees, walls, water, the gate) and billboards
// everything that stands in it. Press M for the old top-down view as a map.
// ---------------------------------------------------------------------------

let fpSwing = 0;
let fpWalk = 0;

// Fixed stars, hung by azimuth so they wheel past as you turn.
const FP_STARS = [];
{
  const srng = mulberry32(77);
  for (let i = 0; i < 70; i++) {
    FP_STARS.push({ az: srng() * Math.PI * 2 - Math.PI, el: 0.08 + srng() * 0.55, tw: srng() * 6 });
  }
}

function fpSolidType(tx, ty) {
  const t = getT(tx, ty);
  if (t === T.TREE || t === T.WALL || t === T.WATER) return t;
  if (t === T.GATE && !gateOpen) return t;
  return 0;
}

function fpUpdate(dt) {
  const p = player;
  fpSwing = Math.max(0, fpSwing - dt);

  // turn and walk
  const turn = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
  p.face += turn * 2.7 * dt;
  const fwd = (keys['w'] || keys['arrowup'] ? 1 : 0) - (keys['s'] || keys['arrowdown'] ? 1 : 0);
  if (pressed['shift'] && p.dodgeCd <= 0) {
    p.dodging = 0.16;
    p.dodgeCd = 0.9;
    p.inv = Math.max(p.inv, 0.32);
    p.dodgeDirX = Math.cos(p.face) * (fwd < 0 ? -1 : 1);
    p.dodgeDirY = Math.sin(p.face) * (fwd < 0 ? -1 : 1);
  }
  if (p.dodging > 0) {
    moveEntity(p, p.dodgeDirX * 460 * dt, p.dodgeDirY * 460 * dt, false);
    fpWalk += dt * 2;
  } else if (fwd) {
    moveEntity(p, Math.cos(p.face) * p.speed * fwd * dt, Math.sin(p.face) * p.speed * fwd * dt, false);
    fpWalk += dt;
  }

  // one button fights: sword up close, bow at range
  if ((mouseClicked || pressed[' ']) && p.atkCd <= 0) {
    let target = null, bd = 74;
    for (const e of enemies) {
      if (e.dead) continue;
      const d = dist(p.x, p.y, e.x, e.y);
      if (d < bd + e.r && Math.abs(angDiff(p.face, angTo(p.x, p.y, e.x, e.y))) < 0.8) { target = e; bd = d; }
    }
    if (target && p.hasSword) {
      p.atkCd = 0.45;
      fpSwing = 0.2;
      p.swingDir = p.face;
      sfx('swing');
      hitEnemy(target, p.dmg, angTo(p.x, p.y, target.x, target.y));
    } else if (target && !p.hasSword) {
      p.atkCd = 0.4;
      msg('Your hands are empty. The sword waits in the stone, east of the fire.');
    } else if (p.arrows > 0) {
      p.atkCd = 0.42;
      p.arrows--;
      fpSwing = 0.1;
      sfx('arrow');
      projectiles.push({
        x: p.x + Math.cos(p.face) * 14, y: p.y + Math.sin(p.face) * 14,
        vx: Math.cos(p.face) * 440, vy: Math.sin(p.face) * 440,
        ttl: 1.5, dmg: Math.max(6, Math.round(p.dmg * 0.75)),
        hostile: false, kind: 'arrow', ang: p.face,
      });
    } else {
      p.atkCd = 0.42;
      fpSwing = 0.2;
      sfx('swing');
      if (mouseClicked) msg('Out of arrows — and nothing in reach of the blade.');
    }
  }

  overworldSystems(dt, p);

  for (const f of dgFloaters) f.ttl -= dt;
  dgFloaters = dgFloaters.filter((f) => f.ttl > 0);
}

// ---------------------------------------------------------------------------
function fpDraw() {
  const w = canvas.width, h = canvas.height;
  const horizon = h / 2;
  const p = player;
  const px2 = p.x / TILE, py2 = p.y / TILE;
  const dirX = Math.cos(p.face), dirY = Math.sin(p.face);
  const planeX = -dirY * 0.66, planeY = dirX * 0.66;
  const colW = 2;
  const flicker = 0.94 + Math.sin(time * 9) * 0.04 + Math.sin(time * 21) * 0.02;

  // night sky
  let g = ctx.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, '#070a16');
  g.addColorStop(1, '#171d3c');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, horizon);

  // stars wheel as you turn
  for (const s of FP_STARS) {
    const rel = angDiff(p.face, s.az);
    if (Math.abs(rel) > 0.85) continue;
    const sx = w / 2 + (rel / 0.85) * (w * 0.62);
    const sy = horizon * (1 - s.el);
    ctx.globalAlpha = 0.35 + Math.sin(time * 2 + s.tw) * 0.2;
    ctx.fillStyle = '#cdd6ee';
    ctx.fillRect(sx, sy, 2, 2);
  }
  ctx.globalAlpha = 1;

  // the moon hangs over the north — follow it to the castle
  const mrel = angDiff(p.face, -Math.PI / 2);
  if (Math.abs(mrel) < 0.95) {
    const mx = w / 2 + (mrel / 0.85) * (w * 0.62);
    const my = horizon * 0.32;
    const mg = ctx.createRadialGradient(mx, my, 0, mx, my, 90);
    mg.addColorStop(0, 'rgba(200,215,245,0.35)');
    mg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = mg;
    ctx.fillRect(mx - 90, my - 90, 180, 180);
    ctx.fillStyle = '#d8e2f4';
    ctx.beginPath(); ctx.arc(mx, my, 26, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(160,175,205,0.5)';
    ctx.beginPath(); ctx.arc(mx - 8, my - 5, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + 7, my + 8, 4, 0, Math.PI * 2); ctx.fill();
  }

  // ground
  g = ctx.createLinearGradient(0, horizon, 0, h);
  g.addColorStop(0, '#0a0e0a');
  g.addColorStop(1, '#1e2a1c');
  ctx.fillStyle = g;
  ctx.fillRect(0, horizon, w, h - horizon);

  // walls, trees, water — raycast
  const zbuf = new Float32Array(Math.ceil(w / colW));
  for (let c = 0; c < w; c += colW) {
    const cameraX = (2 * c) / w - 1;
    const rx = dirX + planeX * cameraX;
    const ry = dirY + planeY * cameraX;
    let mapX = Math.floor(px2), mapY = Math.floor(py2);
    const ddx = Math.abs(1 / (rx || 1e-9)), ddy = Math.abs(1 / (ry || 1e-9));
    let stepX, stepY, sideX, sideY;
    if (rx < 0) { stepX = -1; sideX = (px2 - mapX) * ddx; } else { stepX = 1; sideX = (mapX + 1 - px2) * ddx; }
    if (ry < 0) { stepY = -1; sideY = (py2 - mapY) * ddy; } else { stepY = 1; sideY = (mapY + 1 - py2) * ddy; }
    let side = 0, hit = 0, guard = 0;
    while (guard++ < 40) {
      if (sideX < sideY) { sideX += ddx; mapX += stepX; side = 0; }
      else { sideY += ddy; mapY += stepY; side = 1; }
      hit = fpSolidType(mapX, mapY);
      if (hit) break;
    }
    const d0 = side === 0 ? sideX - ddx : sideY - ddy;
    zbuf[c / colW] = hit ? d0 : 999;
    if (!hit) continue;
    const lineH = Math.min(h * 2.2, h / Math.max(d0, 0.05));
    let cr, cg, cb;
    if (hit === T.TREE) {
      const ashen = mapY < 30;
      cr = ashen ? 42 : 26; cg = ashen ? 42 : 50; cb = ashen ? 38 : 28;
    } else if (hit === T.WALL) { cr = 60; cg = 60; cb = 74; }
    else if (hit === T.WATER) { cr = 22; cg = 40; cb = 66; }
    else { cr = 96; cg = 76; cb = 42; } // the gate
    let shade = clamp(1.65 / (1 + d0 * 0.26), 0.05, 1) * flicker * (side ? 0.72 : 1);
    const wallX = side === 0 ? py2 + d0 * ry : px2 + d0 * rx;
    const frac = wallX - Math.floor(wallX);
    if (frac < 0.06 || frac > 0.94) shade *= 0.6;
    ctx.fillStyle = 'rgb(' + Math.round(cr * shade) + ',' + Math.round(cg * shade) + ',' + Math.round(cb * shade) + ')';
    ctx.fillRect(c, (h - lineH) / 2, colW, lineH);
  }

  // everything that stands in the world, as billboards
  const list = [];
  const seen = 22; // tiles
  const addS = (kind, x, y, obj) => {
    const dx = x / TILE - px2, dy = y / TILE - py2;
    if (dx * dx + dy * dy < seen * seen) list.push({ kind, x: x / TILE, y: y / TILE, obj });
  };
  for (const d of world.decors) addS(d.kind, d.x, d.y, d);
  for (const s of world.lores) addS('lore', s.x, s.y, s);
  for (const n of world.npcs) addS('npc', n.x, n.y, n);
  for (const k of pickups) addS('pickup', k.x, k.y, k);
  for (const e of enemies) if (!e.dead) addS('enemy', e.x, e.y, e);
  for (const pr of projectiles) addS(pr.hostile ? 'bolt' : 'arrowfly', pr.x, pr.y, pr);

  const invDet = 1 / (planeX * dirY - dirX * planeY);
  const proj = [];
  for (const s of list) {
    const sx = s.x - px2, sy = s.y - py2;
    const tX = invDet * (dirY * sx - dirX * sy);
    const tY = invDet * (-planeY * sx + planeX * sy);
    if (tY <= 0.15) continue;
    proj.push({ s, tX, tY });
  }
  proj.sort((a, b) => b.tY - a.tY);
  for (const pr of proj) {
    const { s, tX, tY } = pr;
    const screenX = (w / 2) * (1 + tX / tY);
    const col = Math.floor(screenX / colW);
    if (col >= 0 && col < zbuf.length && zbuf[col] < tY - 0.2) continue;
    const size = h / tY;
    const floorY = h / 2 + size / 2;
    const shade = clamp(1.6 / (1 + tY * 0.24), 0.14, 1) * flicker;
    fpPaint(s, screenX, floorY, size, shade);
  }

  drawFpWeapon(w, h);

  // crosshair
  ctx.strokeStyle = 'rgba(232,223,192,0.6)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(w / 2 - 6, h / 2); ctx.lineTo(w / 2 - 2, h / 2);
  ctx.moveTo(w / 2 + 2, h / 2); ctx.lineTo(w / 2 + 6, h / 2);
  ctx.moveTo(w / 2, h / 2 - 6); ctx.lineTo(w / 2, h / 2 - 2);
  ctx.moveTo(w / 2, h / 2 + 2); ctx.lineTo(w / 2, h / 2 + 6);
  ctx.stroke();

  // compass ribbon
  ctx.font = 'bold 15px Georgia, serif';
  ctx.textAlign = 'center';
  for (const [az, label] of [[-Math.PI / 2, 'N'], [0, 'E'], [Math.PI / 2, 'S'], [Math.PI, 'W'], [-Math.PI, 'W']]) {
    const rel = angDiff(p.face, az);
    if (Math.abs(rel) > 1.1) continue;
    const cx2 = w / 2 + (rel / 1.1) * (w * 0.35);
    ctx.globalAlpha = 1 - Math.abs(rel) / 1.1 * 0.7;
    ctx.fillStyle = label === 'N' ? '#e8c860' : '#9a927e';
    ctx.fillText(label, cx2, 26);
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(232,223,192,0.5)';
  ctx.fillRect(w / 2 - 1, 32, 2, 6);

  // hurt flash
  if (p.inv > 0.35) {
    ctx.fillStyle = 'rgba(160,20,20,' + (p.inv - 0.35) * 0.8 + ')';
    ctx.fillRect(0, 0, w, h);
  }

  // combat text above the crosshair
  ctx.textAlign = 'center';
  ctx.font = 'bold 15px Georgia, serif';
  let fy = h / 2 - 50;
  for (let i = dgFloaters.length - 1; i >= 0; i--) {
    const f = dgFloaters[i];
    ctx.globalAlpha = Math.min(1, f.ttl);
    ctx.fillStyle = f.color;
    ctx.fillText(f.txt, w / 2, fy - (1.6 - f.ttl) * 24);
    fy -= 20;
  }
  ctx.globalAlpha = 1;

  drawVignette();
}

// Billboard painters, working in a 100-unit box anchored at the ground line.
function fpPaint(s, x, floorY, size, shade) {
  ctx.save();
  ctx.translate(x, floorY);
  ctx.scale(size / 100, size / 100);
  ctx.globalAlpha = shade;
  const o = s.obj;

  if (s.kind === 'campfire') {
    ctx.strokeStyle = '#4a3520'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-16, -2); ctx.lineTo(16, -10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-16, -10); ctx.lineTo(16, -2); ctx.stroke();
    fpFlame(0, -8, 22, o.x);
  } else if (s.kind === 'brazier') {
    ctx.fillStyle = '#3a3a44';
    ctx.fillRect(-9, -24, 18, 22);
    ctx.fillRect(-13, -28, 26, 5);
    fpFlame(0, -28, 16, o.x);
  } else if (s.kind === 'lantern') {
    ctx.strokeStyle = '#3a3228'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -62); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -62); ctx.lineTo(16, -56); ctx.stroke();
    const fl = 0.8 + Math.sin(time * 7 + o.x) * 0.2;
    ctx.fillStyle = 'rgba(248,200,64,' + fl + ')';
    ctx.fillRect(10, -56, 12, 15);
    ctx.globalAlpha = Math.min(1, shade * 0.75 + 0.2);
    const g = ctx.createRadialGradient(16, -48, 0, 16, -48, 64);
    g.addColorStop(0, 'rgba(248,200,64,0.9)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(-48, -112, 128, 128);
  } else if (s.kind === 'shrine') {
    ctx.fillStyle = '#3e424e';
    ctx.beginPath();
    ctx.moveTo(-20, 0);
    ctx.quadraticCurveTo(-16, -22, 0, -24);
    ctx.quadraticCurveTo(16, -22, 20, 0);
    ctx.closePath(); ctx.fill();
    if (!world.shrine.taken) {
      const shimmer = 0.7 + Math.sin(time * 3) * 0.3;
      ctx.strokeStyle = 'rgba(200,204,216,' + shimmer + ')';
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(0, -66); ctx.stroke();
      ctx.strokeStyle = '#c8a850'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(-11, -58); ctx.lineTo(11, -58); ctx.stroke();
    }
  } else if (s.kind === 'grave') {
    ctx.fillStyle = '#3c3c46';
    ctx.fillRect(-9, -24, 18, 24);
    ctx.beginPath(); ctx.arc(0, -24, 9, Math.PI, 0); ctx.fill();
  } else if (s.kind === 'stairs') {
    ctx.fillStyle = '#1a1c26';
    ctx.fillRect(-22, -40, 44, 40);
  } else if (s.kind === 'lore') {
    ctx.fillStyle = '#464652';
    ctx.beginPath();
    ctx.moveTo(-11, 0); ctx.lineTo(-8, -42); ctx.lineTo(8, -42); ctx.lineTo(11, 0);
    ctx.closePath(); ctx.fill();
    const glow = 0.4 + Math.sin(time * 2 + o.x) * 0.2;
    ctx.fillStyle = 'rgba(143,214,232,' + glow + ')';
    ctx.fillRect(-3, -34, 6, 6);
    ctx.fillRect(-2, -24, 4, 14);
  } else if (s.kind === 'npc') {
    const robe = o.kind === 'elder' ? '#3a4a3a' : '#5a4428';
    ctx.fillStyle = robe;
    ctx.beginPath();
    ctx.moveTo(0, -52);
    ctx.quadraticCurveTo(-20, -20, -16, 0);
    ctx.lineTo(16, 0);
    ctx.quadraticCurveTo(20, -20, 0, -52);
    ctx.fill();
    ctx.fillStyle = '#c8a888';
    ctx.beginPath(); ctx.arc(0, -38, 8, 0, Math.PI * 2); ctx.fill();
  } else if (s.kind === 'pickup') {
    if (o.type === 'gold') {
      ctx.fillStyle = '#e8c860';
      ctx.beginPath(); ctx.arc(-4, -4, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4, -3, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(0, -9, 5, 0, Math.PI * 2); ctx.fill();
    } else if (o.type === 'potion') {
      ctx.fillStyle = '#c04848';
      ctx.beginPath(); ctx.arc(0, -8, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8a6a4a';
      ctx.fillRect(-3, -20, 6, 7);
    } else if (o.type === 'arrows') {
      ctx.strokeStyle = '#c8bfa0'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-8, -2); ctx.lineTo(8, -16); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-8, -16); ctx.lineTo(8, -2); ctx.stroke();
    }
  } else if (s.kind === 'bolt') {
    ctx.fillStyle = '#7a5ac8';
    ctx.beginPath(); ctx.arc(0, -46, 7 + Math.sin(time * 20) * 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#dcd0ff';
    ctx.beginPath(); ctx.arc(0, -46, 3, 0, Math.PI * 2); ctx.fill();
  } else if (s.kind === 'arrowfly') {
    ctx.fillStyle = '#f4ecd0';
    ctx.fillRect(-4, -48, 8, 4);
  } else if (s.kind === 'enemy') {
    fpPaintEnemy(o);
  }
  ctx.restore();
}

function fpFlame(x, y, sc, seed) {
  const fl = Math.sin(time * 11 + seed) * (sc * 0.2);
  ctx.fillStyle = '#e87828';
  ctx.beginPath();
  ctx.moveTo(x - sc * 0.5, y);
  ctx.quadraticCurveTo(x, y - sc * 1.8 - fl, x + sc * 0.5, y);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f8c840';
  ctx.beginPath();
  ctx.moveTo(x - sc * 0.22, y);
  ctx.quadraticCurveTo(x, y - sc - fl, x + sc * 0.22, y);
  ctx.closePath(); ctx.fill();
}

function fpPaintEnemy(e) {
  const flash = e.hurtT > 0;
  if (e.type === 'wolf') {
    ctx.fillStyle = flash ? '#e8e8e8' : '#4a4a52';
    ctx.beginPath(); ctx.ellipse(0, -14, 22, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(16, -22, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = flash ? '#e8e8e8' : '#3a3a42';
    ctx.fillRect(10, -36, 5, 7); ctx.fillRect(19, -36, 5, 7);
    ctx.fillStyle = '#d8b830';
    ctx.fillRect(19, -25, 4, 4);
    ctx.strokeStyle = flash ? '#e8e8e8' : '#3a3a42'; ctx.lineWidth = 4;
    for (const lx of [-12, -4, 6, 14]) {
      ctx.beginPath(); ctx.moveTo(lx, -6); ctx.lineTo(lx, 0); ctx.stroke();
    }
  } else if (e.type === 'skeleton') {
    const sway = Math.sin(time * 6 + e.homeX) * 3;
    ctx.fillStyle = flash ? '#ffffff' : '#c8c2b0';
    ctx.fillRect(-4 + sway / 2, -46, 8, 26);
    ctx.fillRect(-16 + sway / 2, -42, 32, 4);
    ctx.fillRect(-14 + sway / 2, -34, 28, 4);
    ctx.fillRect(-12 + sway / 2, -26, 24, 4);
    ctx.fillStyle = flash ? '#ffffff' : '#d8d2c0';
    ctx.beginPath(); ctx.arc(sway / 2, -56, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#141418';
    ctx.fillRect(-7 + sway / 2, -60, 5, 6);
    ctx.fillRect(2 + sway / 2, -60, 5, 6);
    ctx.strokeStyle = flash ? '#ffffff' : '#a8a290'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-4, -20); ctx.lineTo(-8, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, -20); ctx.lineTo(8, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(14, -34); ctx.lineTo(30, -50); ctx.stroke();
  } else if (e.type === 'wraith') {
    const bob = Math.sin(time * 3 + e.homeX) * 5;
    ctx.globalAlpha *= 0.8;
    ctx.fillStyle = flash ? '#d8f0f8' : '#26364a';
    ctx.beginPath();
    ctx.moveTo(0, -70 + bob);
    ctx.quadraticCurveTo(-28, -40 + bob, -20, 0);
    ctx.quadraticCurveTo(0, -16 + bob / 2, 20, 0);
    ctx.quadraticCurveTo(28, -40 + bob, 0, -70 + bob);
    ctx.fill();
    ctx.fillStyle = '#8fd6e8';
    ctx.fillRect(-9, -52 + bob, 5, 7);
    ctx.fillRect(4, -52 + bob, 5, 7);
  } else if (e.type === 'boss') {
    // Maldrich: a tall human silhouette in kingly armor, sword point-down
    ctx.scale(1.6, 1.6);
    const body = flash ? '#e8d8d8' : '#16141e';
    // tattered royal cape behind him
    ctx.fillStyle = flash ? '#e8d8d8' : '#3a141c';
    ctx.beginPath();
    ctx.moveTo(-15, -52);
    ctx.quadraticCurveTo(-26, -24, -20, 0);
    ctx.lineTo(20, 0);
    ctx.quadraticCurveTo(26, -24, 15, -52);
    ctx.closePath(); ctx.fill();
    // legs
    ctx.fillStyle = body;
    ctx.fillRect(-10, -26, 8, 26);
    ctx.fillRect(2, -26, 8, 26);
    // armored torso, tapering to the waist
    ctx.beginPath();
    ctx.moveTo(-15, -52); ctx.lineTo(15, -52);
    ctx.lineTo(10, -24); ctx.lineTo(-10, -24);
    ctx.closePath(); ctx.fill();
    // pauldrons and arms
    ctx.fillRect(-21, -55, 10, 9);
    ctx.fillRect(11, -55, 10, 9);
    ctx.fillRect(-19, -48, 6, 22);
    ctx.fillRect(13, -48, 6, 22);
    // faint armor edge-light so he reads as a figure, not a blob
    ctx.strokeStyle = flash ? '#ffffff' : 'rgba(122,110,140,0.65)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-15, -52); ctx.lineTo(-10, -24); ctx.moveTo(15, -52); ctx.lineTo(10, -24);
    ctx.moveTo(-13, -44); ctx.lineTo(13, -44);
    ctx.stroke();
    // head
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(0, -61, 8, 0, Math.PI * 2); ctx.fill();
    // the crown that would not rust
    ctx.fillStyle = '#e8c860';
    ctx.beginPath();
    ctx.moveTo(-8, -67); ctx.lineTo(-8, -77); ctx.lineTo(-4, -69);
    ctx.lineTo(0, -79); ctx.lineTo(4, -69); ctx.lineTo(8, -77);
    ctx.lineTo(8, -67); ctx.closePath(); ctx.fill();
    // burning eyes
    ctx.fillStyle = '#e83030';
    ctx.fillRect(-5, -63, 4, 4);
    ctx.fillRect(2, -63, 4, 4);
    // greatsword, point resting at his feet
    ctx.strokeStyle = flash ? '#ffffff' : '#9aa0ae';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(19, -30); ctx.lineTo(19, -2); ctx.stroke();
    ctx.fillStyle = '#c8a850';
    ctx.fillRect(13, -33, 12, 4);
    ctx.fillRect(17, -38, 4, 5);
    if (e.charging > 0) {
      ctx.strokeStyle = 'rgba(232,48,48,0.5)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, -34, 34 + Math.sin(time * 25) * 4, 0, Math.PI * 2); ctx.stroke();
    }
  }
  if (e.hp < e.hpMax) {
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(-16, -80, 32, 4);
    ctx.fillStyle = '#c04848';
    ctx.fillRect(-16, -80, 32 * (e.hp / e.hpMax), 4);
  }
}

// The knight's arms: sword once drawn, an empty gauntlet before.
function drawFpWeapon(w, h) {
  const bob = Math.sin(fpWalk * 7) * 8;
  const prog = fpSwing > 0 ? 1 - fpSwing / 0.2 : 0;
  const swing = prog > 0 ? Math.sin(prog * Math.PI) : 0;
  ctx.save();
  ctx.translate(w * 0.74 - swing * w * 0.22, h + bob - swing * 60);
  ctx.rotate(-0.5 - swing * 0.9);
  if (player.hasSword) {
    const g = ctx.createLinearGradient(0, -300, 0, 0);
    g.addColorStop(0, '#dfe4ee');
    g.addColorStop(1, '#8a93a6');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-11, -60);
    ctx.lineTo(-4, -310);
    ctx.lineTo(4, -310);
    ctx.lineTo(11, -60);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(-2, -308, 3, 250);
    ctx.fillStyle = '#c8a850';
    ctx.fillRect(-30, -62, 60, 10);
    ctx.fillStyle = '#3a2c1a';
    ctx.fillRect(-8, -52, 16, 60);
  } else {
    // an empty steel gauntlet, waiting for a blade
    ctx.fillStyle = '#7d8698';
    ctx.beginPath(); ctx.ellipse(0, -40, 22, 30, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3c4250'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#8a93a6';
    for (const fx of [-12, -2, 8]) ctx.fillRect(fx, -72, 9, 26);
  }
  ctx.restore();
}
'use strict';

// ---------------------------------------------------------------------------
// EMBERFALL — main game: loop, input, combat, AI, rendering, lighting, UI.
// ---------------------------------------------------------------------------

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const lightCanvas = document.createElement('canvas');
const lctx = lightCanvas.getContext('2d');

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  lightCanvas.width = innerWidth;
  lightCanvas.height = innerHeight;
}
addEventListener('resize', resize);
resize();
canvas.style.cursor = 'crosshair';

// --- mouse (aim + fire the bow) --------------------------------------------
const mouse = { x: 0, y: 0, down: false };
let mouseClicked = false;
canvas.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', () => { audioInit(); mouse.down = true; mouseClicked = true; });
addEventListener('mouseup', () => { mouse.down = false; });

// --- input ------------------------------------------------------------------
const keys = {};     // held keys
const pressed = {};  // keys pressed this frame (cleared after each update)

addEventListener('keydown', (e) => {
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
    e.preventDefault();
  }
  audioInit();
  const k = e.key.toLowerCase();
  if (!e.repeat) pressed[k] = true;
  keys[k] = true;
});
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

// --- game state -------------------------------------------------------------
let state = 'title'; // title | play | dialogue | dead | victory | journal | ending
let mode = 'overworld'; // overworld | dungeon
let viewMode = 'fp';    // fp (first-person) | top (the old view, kept as a map)
let player = null;
let enemies = [];
let pickups = [];
let projectiles = []; // arrows and shadow bolts {x,y,vx,vy,ttl,dmg,hostile,kind,ang}
let floaters = [];   // floating damage / xp text {x,y,txt,ttl,color}
let particles = [];  // {x,y,vx,vy,ttl,color,size}
let dust = [];       // ambient drifting motes
let msgs = [];       // announcements {txt,ttl}
let dialogue = null; // {name, lines, idx}
let boss = null;
let gateOpen = false;
let bossDefeated = false;
let victoryT = 0;
let time = 0;
let shake = 0;
const cam = { x: 0, y: 0 };
let interactTarget = null; // {kind, obj, label}
let quests = [];
let stonesRead = [];
let banner = { txt: '', ttl: 0, last: '' };
let endT = 0; // timer driving the ending cinematic

function newGame() {
  genWorld();
  player = makePlayer(world.playerSpawn.x, world.playerSpawn.y);
  enemies = world.spawns.map((s) => makeEnemy(s.x, s.y, s.type));
  boss = enemies.find((e) => e.boss);
  pickups = world.pickups.map((p) => ({ ...p }));
  floaters = []; particles = []; msgs = []; projectiles = []; dust = [];
  quests = []; stonesRead = [];
  banner = { txt: '', ttl: 0, last: '' };
  mode = 'overworld';
  resetDungeons();
  audioMood('explore');
  gateOpen = false; bossDefeated = false; victoryT = 0; endT = 0; shake = 0;
  addQuest('sword', 'Take Up the Sword', 'An old blade waits in a stone on the village’s eastern edge. Draw it.');
  msg('The village fire is warm. An old sword waits in the stone to the east.  [J] opens your journal.');
}

// --- quest journal ----------------------------------------------------------
function addQuest(id, name, desc) {
  if (quests.find((q) => q.id === id)) return;
  quests.push({ id, name, desc, done: false, count: 0, goal: 0 });
  sfx('quest');
  msg('New quest — ' + name);
}

function getQuest(id) { return quests.find((q) => q.id === id); }

function completeQuest(id) {
  const q = getQuest(id);
  if (q && !q.done) { q.done = true; sfx('quest'); msg('Quest complete — ' + q.name); }
}

function msg(txt) {
  msgs.push({ txt, ttl: 4.5 });
  while (msgs.length > 4) msgs.shift();
}

function floater(x, y, txt, color) {
  floaters.push({ x, y, txt, ttl: 1.1, color });
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 40 + Math.random() * 120;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      ttl: 0.3 + Math.random() * 0.3, color, size: 1 + Math.random() * 2.5,
    });
  }
}

// --- collision --------------------------------------------------------------
function solidAt(pxx, pyy, ghost) {
  const t = getT(Math.floor(pxx / TILE), Math.floor(pyy / TILE));
  if (t === T.TREE) return !ghost;
  if (t === T.WALL || t === T.WATER) return true;
  if (t === T.GATE) return !gateOpen;
  return false;
}

function canStand(x, y, r, ghost) {
  return !solidAt(x - r, y - r, ghost) && !solidAt(x + r, y - r, ghost) &&
         !solidAt(x - r, y + r, ghost) && !solidAt(x + r, y + r, ghost);
}

// Move with axis-separated collision so entities slide along walls.
function moveEntity(e, dx, dy, ghost) {
  if (dx !== 0 && canStand(e.x + dx, e.y, e.r, ghost)) e.x += dx;
  if (dy !== 0 && canStand(e.x, e.y + dy, e.r, ghost)) e.y += dy;
}

// --- update -----------------------------------------------------------------
let lastT = performance.now();
function frame(now) {
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  update(dt);
  draw();
  for (const k in pressed) pressed[k] = false;
  mouseClicked = false;
  requestAnimationFrame(frame);
}

function update(dt) {
  time += dt;
  shake = Math.max(0, shake - dt * 30);

  if (state === 'title') {
    if (pressed['enter'] || mouseClicked) { newGame(); state = 'play'; }
    return;
  }
  if (state === 'dead') {
    if (pressed['enter'] || mouseClicked) {
      player.hp = player.maxHp;
      player.gold = Math.floor(player.gold * 0.8);
      player.x = world.playerSpawn.x;
      player.y = world.playerSpawn.y;
      player.inv = 2;
      state = 'play';
      msg('You wake by the fire, lighter of purse.');
    }
    return;
  }
  if (state === 'victory') {
    if (pressed['enter']) { state = 'play'; msg('The land is quiet now. Wander as you will.'); }
    return;
  }
  if (state === 'ending') {
    endT += dt;
    if ((pressed['enter'] || mouseClicked) && endT > 3) {
      state = 'play';
      audioMood('explore');
      msg('Dawn holds. The land is quiet now — wander as you will.');
    }
    return;
  }
  if (state === 'dialogue') {
    if (pressed['e'] || pressed['enter'] || pressed[' ']) {
      dialogue.idx++;
      if (dialogue.idx >= dialogue.lines.length) { dialogue = null; state = 'play'; }
    }
    return;
  }
  if (state === 'journal') {
    if (pressed['j'] || pressed['escape'] || pressed['e']) state = 'play';
    return;
  }

  // ---- state === 'play' ----
  const p = player;
  if (pressed['j']) { state = 'journal'; return; }
  p.atkCd = Math.max(0, p.atkCd - dt);
  p.bowCd = Math.max(0, p.bowCd - dt);
  p.swing = Math.max(0, p.swing - dt);
  p.dodgeCd = Math.max(0, p.dodgeCd - dt);
  p.dodging = Math.max(0, p.dodging - dt);
  p.inv = Math.max(0, p.inv - dt);
  p.lastHurt += dt;

  // out-of-combat regeneration
  if (p.lastHurt > 5 && p.hp < p.maxHp) p.hp = Math.min(p.maxHp, p.hp + 4 * dt);

  // drink potion (works everywhere)
  if (pressed['q']) {
    if (p.potions > 0 && p.hp < p.maxHp) {
      p.potions--;
      p.hp = Math.min(p.maxHp, p.hp + 60);
      sfx('potion');
      floater(p.x, p.y - 20, '+60', '#7dd87d');
    } else if (p.potions <= 0) {
      msg('No potions left. Osric in the village sells them.');
    }
  }

  if (mode === 'overworld' && pressed['m']) {
    viewMode = viewMode === 'fp' ? 'top' : 'fp';
    msg(viewMode === 'fp' ? 'Back to your own eyes.' : 'The land from above — press M to return.');
  }
  if (pressed['n']) {
    audioToggle();
    msg(audio.muted ? 'Sound off.' : 'Sound on.');
  }

  if (mode === 'dungeon') {
    dungeonUpdate(dt);
  } else if (viewMode === 'fp') {
    fpUpdate(dt);
  } else {
    overworldUpdate(dt, p);
  }

  // messages tick in both modes
  for (const m of msgs) m.ttl -= dt;
  msgs = msgs.filter((m) => m.ttl > 0);
  banner.ttl = Math.max(0, banner.ttl - dt);

  if (victoryT > 0) {
    victoryT -= dt;
    if (victoryT <= 0) { state = 'ending'; endT = 0; }
  }
  if (p.hp <= 0) {
    state = 'dead';
    mode = 'overworld';
    sfx('death');
    burst(p.x, p.y, '#c04848', 24);
  }
}

function overworldUpdate(dt, p) {
  // movement
  let mx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
  let my = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);
  if (mx || my) {
    const len = Math.hypot(mx, my);
    mx /= len; my /= len;
    p.face = Math.atan2(my, mx);
  }
  if (pressed['shift'] && p.dodgeCd <= 0) {
    p.dodging = 0.18;
    p.dodgeCd = 0.9;
    p.inv = Math.max(p.inv, 0.32);
    p.dodgeDirX = mx || Math.cos(p.face);
    p.dodgeDirY = my || Math.sin(p.face);
    burst(p.x, p.y, '#9aa3b8', 6);
  }
  if (p.dodging > 0) {
    moveEntity(p, p.dodgeDirX * 460 * dt, p.dodgeDirY * 460 * dt, false);
  } else {
    moveEntity(p, mx * p.speed * dt, my * p.speed * dt, false);
  }

  // sword swing (only once the blade is drawn from the stone)
  if (pressed[' '] && p.atkCd <= 0) {
    if (!p.hasSword) {
      msg('Your hands are empty. The sword waits in the stone, east of the fire.');
    } else {
      p.atkCd = 0.42;
      p.swing = 0.16;
      p.swingDir = p.face;
      sfx('swing');
      for (const e of enemies) {
        if (e.dead) continue;
        const d = dist(p.x, p.y, e.x, e.y);
        if (d < 46 + e.r && Math.abs(angDiff(p.swingDir, angTo(p.x, p.y, e.x, e.y))) < 1.15) {
          hitEnemy(e, p.dmg, angTo(p.x, p.y, e.x, e.y));
        }
      }
    }
  }

  // loose an arrow toward the cursor (hold to keep firing)
  if (mouse.down && p.bowCd <= 0) {
    if (p.arrows > 0) {
      p.bowCd = 0.34;
      p.arrows--;
      sfx('arrow');
      const a = angTo(p.x, p.y, mouse.x + cam.x, mouse.y + cam.y);
      p.face = a;
      projectiles.push({
        x: p.x + Math.cos(a) * 14, y: p.y + Math.sin(a) * 14,
        vx: Math.cos(a) * 440, vy: Math.sin(a) * 440,
        ttl: 1.5, dmg: Math.max(6, Math.round(p.dmg * 0.75)),
        hostile: false, kind: 'arrow', ang: a,
      });
    } else if (mouseClicked) {
      msg('Out of arrows. Fallen foes and Trader Osric carry more.');
    }
  }

  overworldSystems(dt, p);

  // ambient dust only matters in the top-down view
  while (dust.length < 45) {
    dust.push({
      x: cam.x + Math.random() * canvas.width,
      y: cam.y + Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 12, vy: -5 - Math.random() * 9,
      ttl: 3 + Math.random() * 4,
    });
  }
  for (const d0 of dust) { d0.ttl -= dt; d0.x += d0.vx * dt; d0.y += d0.vy * dt; }
  dust = dust.filter((d0) => d0.ttl > 0);
}

// The living world: shared by the first-person and top-down views.
function overworldSystems(dt, p) {
  updateProjectiles(dt, p);
  updateInteract();
  if (pressed['e'] && interactTarget) triggerInteract(interactTarget);
  if (mode !== 'overworld') return; // just descended into a dungeon

  updateEnemies(dt);
  updatePickups();

  // region banner when crossing into a new land
  const rn = regionName(p.x, p.y);
  if (rn !== banner.last) {
    banner.last = rn;
    banner.txt = rn;
    banner.ttl = 3.2;
  }
  // arriving at the castle completes the journey
  if (rn === 'Castle Maldrich') {
    const jq = getQuest('journey');
    if (jq && !jq.done) {
      completeQuest('journey');
      addQuest('king', 'The Fallen King', 'Maldrich waits on his throne at the castle’s heart. End this.');
    }
  }

  for (const f of floaters) { f.ttl -= dt; f.y -= 30 * dt; }
  floaters = floaters.filter((f) => f.ttl > 0);
  for (const q of particles) {
    q.ttl -= dt; q.x += q.vx * dt; q.y += q.vy * dt;
    q.vx *= 0.92; q.vy *= 0.92;
  }
  particles = particles.filter((q) => q.ttl > 0);

  // camera stays pinned to the knight for the map view
  cam.x = clamp(p.x - canvas.width / 2, 0, MW * TILE - canvas.width);
  cam.y = clamp(p.y - canvas.height / 2, 0, MH * TILE - canvas.height);
}

function updateProjectiles(dt, p) {
  for (const pr of projectiles) {
    pr.ttl -= dt;
    pr.x += pr.vx * dt;
    pr.y += pr.vy * dt;
    // shadow bolts drift through trees the way their casters do
    if (solidAt(pr.x, pr.y, pr.hostile)) {
      pr.ttl = 0;
      burst(pr.x, pr.y, pr.hostile ? '#8a7ac8' : '#c8bfa0', 4);
      continue;
    }
    if (pr.hostile) {
      if (dist(pr.x, pr.y, p.x, p.y) < p.r + 5) {
        pr.ttl = 0;
        if (p.inv <= 0) {
          p.hp -= pr.dmg;
          p.inv = 0.6;
          p.lastHurt = 0;
          shake = 5;
          sfx('hurt');
          burst(p.x, p.y, '#a88ae8', 10);
          floater(p.x, p.y - 22, '-' + pr.dmg, '#e86060');
        }
      }
      if (Math.random() < dt * 18) {
        particles.push({ x: pr.x, y: pr.y, vx: 0, vy: 0, ttl: 0.25, color: '#6a5aa8', size: 2 });
      }
    } else {
      for (const e of enemies) {
        if (e.dead) continue;
        if (dist(pr.x, pr.y, e.x, e.y) < e.r + 5) {
          pr.ttl = 0;
          hitEnemy(e, pr.dmg, pr.ang);
          break;
        }
      }
    }
  }
  projectiles = projectiles.filter((pr) => pr.ttl > 0);
}

// Which land the knight stands in — used for the banner and terrain moods.
function regionName(x, y) {
  const tx = x / TILE, ty = y / TILE;
  if (tx > 36 && tx < 60 && ty > 6 && ty < 26) return 'Castle Maldrich';
  if (Math.hypot(tx - world.village.tx, ty - world.village.ty) < 11) return 'Emberside Village';
  if (ty < 30) return 'The Ashen Approach';
  if (ty > 74) return 'The Gravehills';
  if (tx < 32) return 'The Weeping Woods';
  if (tx > 64) return 'The Mirefen';
  return 'The Old Road';
}

function hitEnemy(e, dmg, ang) {
  e.hp -= dmg;
  e.hurtT = 0.15;
  e.kx += Math.cos(ang) * 180;
  e.ky += Math.sin(ang) * 180;
  e.aggroed = true;
  burst(e.x, e.y, e.type === 'wraith' ? '#8fd6e8' : '#d8d0c0', 6);
  sfx('hit');
  floater(e.x, e.y - e.r - 6, String(dmg), '#f0e6c8');
  if (mode === 'overworld' && viewMode === 'fp') dgFloat(String(dmg), '#f0e6c8');
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  e.dead = true;
  burst(e.x, e.y, '#5a5a6a', 14);
  sfx(e.boss ? 'bossdie' : 'kill');
  gainXp(e.xp);
  floater(e.x, e.y - 16, '+' + e.xp + ' xp', '#b48ce8');
  if (mode === 'overworld' && viewMode === 'fp') dgFloat('+' + e.xp + ' xp', '#b48ce8');
  const g = 3 + Math.floor(Math.random() * 6);
  pickups.push({ x: e.x, y: e.y, type: 'gold', val: g });
  if (Math.random() < 0.22) {
    pickups.push({ x: e.x + 14, y: e.y + 6, type: 'potion' });
  }
  if (Math.random() < 0.35) {
    pickups.push({ x: e.x - 12, y: e.y - 8, type: 'arrows', val: 3 });
  }
  if (e.boss) {
    bossDefeated = true;
    completeQuest('king');
    audioMood('ending');
    victoryT = 2.2; // a breath before the ending scene begins
    msg('The Fallen King is no more.');
    shake = 12;
  }
}

function gainXp(amount) {
  const p = player;
  p.xp += amount;
  while (p.xp >= p.xpNext) {
    p.xp -= p.xpNext;
    p.level++;
    p.xpNext = Math.floor(40 * Math.pow(p.level, 1.35));
    p.maxHp += 15;
    p.dmg += 3;
    p.hp = p.maxHp;
    sfx('level');
    msg('Level ' + p.level + ' — your blade grows heavier, your resolve harder.');
    burst(p.x, p.y, '#b48ce8', 20);
  }
}

function updateEnemies(dt) {
  const p = player;
  for (const e of enemies) {
    if (e.dead) continue;
    e.touchCd = Math.max(0, e.touchCd - dt);
    e.hurtT = Math.max(0, e.hurtT - dt);
    const d = dist(e.x, e.y, p.x, p.y);

    // knockback decay
    if (e.kx || e.ky) {
      moveEntity(e, e.kx * dt, e.ky * dt, e.ghost);
      e.kx *= 0.85; e.ky *= 0.85;
      if (Math.abs(e.kx) < 4) e.kx = 0;
      if (Math.abs(e.ky) < 4) e.ky = 0;
    }

    if (!e.aggroed && d < e.aggro) {
      e.aggroed = true;
      if (e.boss) { sfx('roar'); audioMood('boss'); msg('MALDRICH, THE FALLEN KING, RISES FROM HIS THRONE'); shake = 8; }
    }
    // lose interest if the player runs far away (except the king)
    if (e.aggroed && !e.boss && d > e.aggro * 2.2) e.aggroed = false;

    if (e.boss && e.aggroed) {
      // periodic charge attack
      e.chargeT -= dt;
      if (e.charging > 0) {
        e.charging -= dt;
        moveEntity(e, e.chDirX * e.speed * 3.1 * dt, e.chDirY * e.speed * 3.1 * dt, false);
      } else if (e.chargeT <= 0) {
        e.chargeT = 3.5;
        e.charging = 0.65;
        const a = angTo(e.x, e.y, p.x, p.y);
        e.chDirX = Math.cos(a); e.chDirY = Math.sin(a);
        burst(e.x, e.y, '#c04848', 10);
      } else {
        const a = angTo(e.x, e.y, p.x, p.y);
        moveEntity(e, Math.cos(a) * e.speed * dt, Math.sin(a) * e.speed * dt, false);
      }
      if (!e.spawnedAdds && e.hp < e.hpMax / 2) {
        e.spawnedAdds = true;
        msg('"You will kneel, as the others knelt."');
        for (const off of [-40, 40]) {
          const w = makeEnemy(e.x + off, e.y, 'wraith');
          w.aggroed = true;
          enemies.push(w);
        }
      }
      // shadow-bolt volley between charges
      e.volleyT -= dt;
      if (e.volleyT <= 0 && e.charging <= 0) {
        e.volleyT = 4.5;
        const a = angTo(e.x, e.y, p.x, p.y);
        for (let i = -2; i <= 2; i++) fireBolt(e.x, e.y, a + i * 0.22, 230, 14);
        burst(e.x, e.y, '#8a5ac8', 12);
      }
    } else if (e.aggroed) {
      const a = angTo(e.x, e.y, p.x, p.y);
      if (e.type === 'wraith') {
        // wraiths keep their distance and hurl shadow bolts
        let mvx, mvy;
        if (d > 260) { mvx = Math.cos(a); mvy = Math.sin(a); }
        else if (d < 140) { mvx = -Math.cos(a); mvy = -Math.sin(a); }
        else { mvx = Math.cos(a + Math.PI / 2) * 0.55; mvy = Math.sin(a + Math.PI / 2) * 0.55; }
        moveEntity(e, mvx * e.speed * dt, mvy * e.speed * dt, true);
        e.fireT -= dt;
        if (e.fireT <= 0 && d < 380) {
          e.fireT = 2.4;
          fireBolt(e.x, e.y, a, 210, 10);
        }
      } else {
        moveEntity(e, Math.cos(a) * e.speed * dt, Math.sin(a) * e.speed * dt, e.ghost);
      }
    } else {
      // idle wander around home
      e.wanderT -= dt;
      if (e.wanderT <= 0) {
        e.wanderT = 1.5 + Math.random() * 2.5;
        if (dist(e.x, e.y, e.homeX, e.homeY) > 120) {
          const a = angTo(e.x, e.y, e.homeX, e.homeY);
          e.wx = Math.cos(a); e.wy = Math.sin(a);
        } else if (Math.random() < 0.5) {
          const a = Math.random() * Math.PI * 2;
          e.wx = Math.cos(a); e.wy = Math.sin(a);
        } else {
          e.wx = 0; e.wy = 0;
        }
      }
      moveEntity(e, e.wx * e.speed * 0.3 * dt, e.wy * e.speed * 0.3 * dt, e.ghost);
    }

    // contact damage
    if (d < e.r + p.r + 3 && e.touchCd <= 0 && p.inv <= 0) {
      e.touchCd = 0.8;
      p.hp -= e.dmg;
      p.inv = 0.6;
      p.lastHurt = 0;
      shake = 6;
      sfx('hurt');
      burst(p.x, p.y, '#c04848', 10);
      floater(p.x, p.y - 22, '-' + e.dmg, '#e86060');
    }
  }
}

function fireBolt(x, y, a, speed, dmg) {
  if (dist(x, y, player.x, player.y) < 600) sfx('bolt');
  projectiles.push({
    x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
    ttl: 2.2, dmg, hostile: true, kind: 'bolt', ang: a,
  });
}

function updatePickups() {
  const p = player;
  for (const k of pickups) {
    if (k.got) continue;
    if (dist(p.x, p.y, k.x, k.y) < 22) {
      k.got = true;
      if (k.type === 'gold') {
        p.gold += k.val;
        sfx('pickup');
        floater(k.x, k.y - 10, '+' + k.val + 'g', '#e8c860');
      } else if (k.type === 'potion') {
        p.potions++;
        sfx('pickup');
        floater(k.x, k.y - 10, '+potion', '#e86060');
